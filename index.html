<style>
:root{--rosa:#ffc8f5;--rosa2:#fff0fb;--coral:#ff5a7a;--verm:#cc2233;--txt:#3a1f2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--txt);background:var(--rosa2);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(160deg,#ffc8f5 0%,#ffdbe6 100%);text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 64px;border-bottom:4px solid var(--verm)}
header .logo{width:132px;height:132px;border-radius:50%;box-shadow:0 4px 14px rgba(204,34,51,.3);background:#fff}
header h1{margin:10px 0 2px;font-size:clamp(22px,5vw,32px);color:var(--verm)}
header p{margin:0;font-size:16px;color:#7a3b4f}
.busca{max-width:640px;margin:-28px auto 0;padding:0 16px;position:relative;z-index:2}
.busca input{width:100%;padding:16px 46px 16px 20px;font-size:17px;border:3px solid var(--coral);border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.15);outline:none;background:#fff;color:var(--txt)}
.busca input:focus{border-color:var(--verm)}
.busca button{position:absolute;right:28px;top:50%;transform:translateY(-50%);border:0;background:#eee;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:none}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
#info{text-align:center;font-size:15px;color:#7a3b4f;margin:6px 0 16px;min-height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);border:3px solid transparent;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--coral);outline:none}
a.card:active{transform:scale(.98)}
.foto{aspect-ratio:1/1;background:var(--rosa2);display:flex;align-items:center;justify-content:center}
.foto img{width:100%;height:100%;object-fit:contain}
.corpo{padding:10px 12px 14px;text-align:center}
.corpo b{display:block;font-size:18px;color:var(--verm);line-height:1.2}
.corpo small{display:block;margin-top:4px;color:#8a6573;font-size:13px}
mark{background:#ffe27a;color:inherit;border-radius:3px}
.vazio{text-align:center;padding:40px 10px;font-size:18px;color:#7a3b4f;display:none}
footer{text-align:center;font-size:13px;color:#8a6573;padding:0 16px 24px}
</style>
</head>

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function marca(t,termo){
  if(!termo)return esc(t);
  var i=norm(t).indexOf(termo);
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+termo.length))+"</mark>"+esc(t.slice(i+termo.length));
}

    if(termo&&norm(t.titulo).indexOf(termo)<0)return;
    achou++;
    html+='<a class="card" href="'+t.pasta+'"><div class="foto"><img loading="lazy" src="'+t.capa+'" alt=""></div><div class="corpo"><b>'+marca(t.titulo,termo)+'</b><small>'+esc(t.sub)+'</small></div></a>';
  });
  document.getElementById("grid").innerHTML=html;
  document.getElementById("vazio").style.display=achou?"none":"block";
  document.getElementById("info").textContent=termo?(achou?achou+(achou===1?" tema encontrado":" temas encontrados"):""):TEMAS.length+(TEMAS.length===1?" tema disponível":" temas disponíveis");
}
var q=document.getElementById("q");
q.addEventListener("input",desenha);
document.getElementById("x").onclick=function(){q.value="";desenha();q.focus();};
desenha();
</script>
</body>
</html>
