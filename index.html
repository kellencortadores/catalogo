<style>
:root{--rosa:#ffc8f5;--rosa2:#fff0fb;--coral:#ff5a7a;--verm:#cc2233;--verde:#1b7a34;--txt:#3a1f2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--txt);background:var(--rosa2);padding-bottom:env(safe-area-inset-bottom)}
header{position:relative;background:linear-gradient(160deg,#ffc8f5 0%,#ffdbe6 100%);text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 64px;border-bottom:4px solid var(--verm);overflow:hidden}
header .logo{width:132px;height:132px;border-radius:50%;box-shadow:0 4px 14px rgba(204,34,51,.3);background:#fff}
header h1{margin:10px 0 2px;font-size:clamp(22px,5vw,32px);color:var(--verm)}
header p{margin:0;font-size:16px;color:#7a3b4f}
.neve{position:absolute;inset:0;pointer-events:none;font-size:18px;color:#fff;opacity:.85}
.neve span{position:absolute;top:-20px;animation:cai linear infinite}
@keyframes cai{to{transform:translateY(340px) rotate(180deg)}}
@media(prefers-reduced-motion:reduce){.neve{display:none}}
.busca{max-width:640px;margin:-28px auto 0;padding:0 16px;position:relative;z-index:2}
.busca input{width:100%;padding:16px 46px 16px 20px;font-size:17px;border:3px solid var(--coral);border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.15);outline:none;background:#fff;color:var(--txt)}
.busca input:focus{border-color:var(--verm)}
.busca button{position:absolute;right:28px;top:50%;transform:translateY(-50%);border:0;background:#eee;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:none}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
#info{text-align:center;font-size:15px;color:#7a3b4f;margin:6px 0 16px;min-height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12);border:3px solid transparent;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--coral);outline:none}
a.card:active{transform:scale(.98)}
.foto{aspect-ratio:1/1;background:var(--rosa2);display:flex;align-items:center;justify-content:center}
.foto img{width:100%;height:100%;object-fit:contain}
.corpo{padding:10px 12px 14px;text-align:center}
.corpo b{display:block;font-size:17px;color:var(--verm);line-height:1.2}
.corpo small{display:block;margin-top:4px;color:#8a6573;font-size:13px}
.achados{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.achados i{font-style:normal;font-size:11.5px;background:#e8f7ec;color:var(--verde);border-radius:10px;padding:3px 8px;line-height:1.2}
mark{background:#ffe27a;color:inherit;border-radius:3px}
.vazio{text-align:center;padding:40px 10px;font-size:18px;color:#7a3b4f;display:none}
footer{text-align:center;font-size:13px;color:#8a6573;padding:0 16px 24px}
</style>
</head>

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function marca(t,termo){
  if(!termo)return esc(t);
  var i=norm(t).indexOf(termo);
  if(i<0)return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+termo.length))+"</mark>"+esc(t.slice(i+termo.length));
}
function limpaNome(n){return n.replace(/\s*\(Imagem\d+\)\s*/g," ").replace(/^\d+\s*-\s*/,"").trim();}
function desenha(){
  var termo=norm(document.getElementById("q").value.trim());
  document.getElementById("x").style.display=termo?"block":"none";
  var html="",achou=0,itens=0;
  CATS.forEach(function(c){
    var casaTitulo=!termo||norm(c.title).indexOf(termo)>=0;
    var m=[];
    if(termo){c.names.forEach(function(n){var l=limpaNome(n);if(norm(l).indexOf(termo)>=0&&m.indexOf(l)<0)m.push(l);});}
    if(!casaTitulo&&!m.length)return;
    achou++;itens+=termo?(m.length||c.n):0;
    var chips=(termo&&m.length&&!casaTitulo?m:[]).slice(0,4).map(function(n){return "<i>"+marca(n,termo)+"</i>";}).join("");
    if(termo&&m.length>4&&!casaTitulo)chips+="<i>+"+(m.length-4)+"</i>";
    html+='<a class="card" href="'+c.file+'"><div class="foto"><img loading="lazy" src="'+c.cover+'" alt=""></div><div class="corpo"><b>'+marca(c.title,termo)+'</b><small>'+c.n+(c.n===1?" item":" itens")+'</small>'+(chips?'<div class="achados">'+chips+'</div>':'')+'</div></a>';
  });
  document.getElementById("grid").innerHTML=html;
  document.getElementById("vazio").style.display=achou?"none":"block";
  document.getElementById("info").textContent=termo?(achou?achou+(achou===1?" tema encontrado":" temas encontrados"):""):CATS.length+" temas disponíveis";
}
var q=document.getElementById("q");
q.addEventListener("input",desenha);
document.getElementById("x").onclick=function(){q.value="";desenha();q.focus();};
desenha();
(function(){var n=document.getElementById("neve"),h="";for(var i=0;i<18;i++){h+='<span style="left:'+(i*5.6+Math.random()*4).toFixed(1)+'%;font-size:'+(12+Math.random()*12|0)+'px;animation-duration:'+(6+Math.random()*7).toFixed(1)+'s;animation-delay:-'+(Math.random()*10).toFixed(1)+'s">❄</span>';}n.innerHTML=h;})();
</script>
